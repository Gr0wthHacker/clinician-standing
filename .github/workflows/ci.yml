name: CI

# ACTIONS ARE PINNED BY COMMIT SHA, NOT BY TAG.
# A tag is a mutable pointer: whoever can push to the action's repository can
# move `v4` to any commit, and every workflow in the world that references `v4`
# runs it on the next trigger, with this repository checked out. In
# ingest-monthly.yml the same step runs with DATABASE_URL in the environment.
# Several supply-chain incidents have worked exactly that way. A SHA is
# immutable, so an upgrade becomes a reviewable diff instead of something that
# happens to you.
#
# To bump one, look the tag up and replace both the SHA and the comment:
#   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
# Keep the trailing version comment: it is the only human-readable record of
# which release a digest corresponds to.

# Fast feedback on every change: lint, types, tests.
# Deliberately hermetic — no network calls, no database, no secrets.
# If a job here needs a secret, it belongs in ingest-monthly.yml instead.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Install from the hashed lockfile, not from pyproject's version ranges, so
      # CI runs the exact dependency set a `make lock` pinned. --require-hashes
      # verifies every wheel; the editable package is installed separately with
      # --no-deps because a local path has no hash. A dependency added to
      # pyproject without a `make lock` fails here at import, which is the drift
      # signal.
      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Each check runs even if an earlier one failed, so one push surfaces
      # every problem instead of one problem at a time.
      - name: Ruff lint
        id: ruff_lint
        run: ruff check --output-format=github src tests

      - name: Ruff format check
        id: ruff_format
        if: ${{ !cancelled() }}
        run: ruff format --check src tests

      - name: Mypy
        id: mypy
        if: ${{ !cancelled() }}
        run: mypy

      # The workflow in ingest-monthly.yml and the `ingest` target in the
      # Makefile invoke the CLI with flags. Nothing else in CI executes the
      # entry point, so a renamed or dropped flag used to surface only as
      # `error: unrecognized arguments` in a scheduled run a month later.
      # Fail the build here instead.
      - name: CLI contract
        id: cli_contract
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          clinician-standing --help
          clinician-standing ingest --help
          help_text="$(clinician-standing ingest --help)"
          for flag in --all --sources --dry-run; do
            if ! printf '%s' "$help_text" | grep -q -- "$flag"; then
              echo "::error::clinician-standing ingest no longer accepts $flag," \
                   "which ingest-monthly.yml and the Makefile pass"
              exit 1
            fi
          done

      - name: Pytest
        id: pytest
        if: ${{ !cancelled() }}
        # -p no:cacheprovider keeps the runner from writing .pytest_cache.
        # No network and no DATABASE_URL are set here on purpose: any test that
        # needs either must be marked `network` or `database` and deselected.
        run: pytest -p no:cacheprovider -m "not network and not database"

  # The `check` job above is hermetic. This one is not: it stands up a real
  # Postgres, applies every migration and seed, and runs the `database`-marked
  # tests. The SQL that only fails on a server -- the ON CONFLICT arbiter
  # inference in the obligations upsert, the RLS policies, the FORCE-RLS
  # self-checks -- is proven here on every PR instead of a month later on the
  # real database.
  database:
    name: migrations / seeds / database tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/csdb
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/csdb
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history so the migration lint can diff against the base branch.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Applied migrations are immutable and numbers strictly increase; a PR that
      # edits a merged migration or reuses a number fails here.
      - name: Migration lint
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main \
            || echo "no origin/main yet; the immutability check is skipped"
          python db/ci/check_migrations.py origin/main

      - name: Bootstrap Supabase roles
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f db/ci/bootstrap.sql

      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in db/migrations/0*.sql; do
            echo "::group::apply $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Load seeds
        run: |
          set -euo pipefail
          for f in db/seeds/*.sql; do
            echo "::group::seed $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Database tests
        run: pytest -p no:cacheprovider -m database
