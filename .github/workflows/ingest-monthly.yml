name: Monthly federal ingest

# ACTIONS ARE PINNED BY COMMIT SHA, NOT BY TAG.
# A tag is a mutable pointer: whoever can push to the action's repository can
# move `v4` to any commit, and every workflow in the world that references `v4`
# runs it on the next trigger. THIS workflow is the one that matters: its steps
# run with DATABASE_URL in the environment, so a moved tag is a credential
# disclosure, not just an unexpected build. Several supply-chain incidents have
# worked exactly that way. A SHA is immutable, so an upgrade becomes a
# reviewable diff instead of something that happens to you.
#
# To bump one, look the tag up and replace both the SHA and the comment:
#   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
# Keep the trailing version comment: it is the only human-readable record of
# which release a digest corresponds to.

# =============================================================================
# READ THIS BEFORE WONDERING WHY THE CRON NEVER FIRES
#
#   Scheduled workflows are DISABLED on private repositories owned by a free
#   personal GitHub account. On the free tier a private repo gets Actions
#   minutes, but `on: schedule` is silently ignored — no run, no error, no
#   notification. There are exactly two fixes:
#
#     1. GitHub Pro on the owning account ($4/month), or
#     2. make the repository public.
#
#   `workflow_dispatch` (the "Run workflow" button, and `gh workflow run`)
#   works on the free tier regardless, on private repos included. Until one of
#   the two fixes is in place, treat this workflow as manual-only and put a
#   recurring calendar reminder on the first of the month.
#
#   Second caveat that bites even on paid plans: GitHub disables scheduled
#   workflows in a repository with no commit activity for 60 days, and emails
#   the owner. A repo that only runs ingest will hit this. Push something, or
#   re-enable the workflow from the Actions tab when it happens.
# =============================================================================

on:
  schedule:
    # 07:15 UTC on the 1st of every month. CMS publishes the Doctors and
    # Clinicians file and the revalidation file monthly; OIG publishes LEIE
    # in the first week. Running at :15 rather than :00 avoids the top-of-hour
    # queue on GitHub's shared schedulers.
    - cron: "15 7 1 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated federal source keys (nursys runs elsewhere)"
        required: false
        default: "cms_dac,cms_revalidation,oig_leie"
      dry_run:
        description: "Download and diff but do not write to the database"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Never let two ingests write the same tables at once. A queued run waits
# rather than being cancelled — a half-finished ingest is worse than a late one.
concurrency:
  group: ingest-monthly
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  # =========================================================================
  # STORAGE_PATH holds two things that must outlive the job:
  #
  #   1. Raw evidence payloads. evidence.payload_ref points here and the
  #      retention requirement is seven years. A path under the runner
  #      workspace is destroyed minutes after the run, so every payload_ref
  #      written from here cites a file that no longer exists.
  #   2. The connector diff state (storage/state/**). Lose it and every run
  #      re-classifies the whole file as new -- all 2.0M DAC rows -- and the
  #      Phase 2 acceptance criterion fails silently with status ok.
  #
  # PRODUCTION FIX: set this to an s3://bucket/prefix URI. config.py parses
  # it (S3 bucket/prefix, see Settings.storage_is_s3) and evidence.py already
  # writes and reads through boto3, so nothing else has to change beyond
  # giving the job AWS credentials.
  #
  # Until that is done, Connector.run() REFUSES to run with raw payload
  # storage enabled and a STORAGE_PATH inside the workspace, rather than
  # writing evidence rows that point at a dead path. To run here anyway,
  # without raw payload retention, set STORE_RAW_PAYLOADS=false on the ingest
  # step below; the cache step keeps the diff state across runs.
  # =========================================================================
  STORAGE_PATH: ${{ github.workspace }}/storage

jobs:
  ingest:
    name: Download, diff and load
    runs-on: ubuntu-latest
    # Generous on purpose: ~1.4GB of downloads from CMS (which is slow and
    # occasionally stalls), a 3.39M-row parse, and the COPY into Supabase.
    # A normal run is 10-25 minutes; the ceiling is here to catch a hang.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # ---------------------------------------------------------------------
      # Disk. A stock ubuntu-latest runner has a 14GB SSD with roughly 14GB
      # free after the preinstalled image, and the image itself (Android SDK,
      # .NET, GHC, CodeQL bundles, Docker images) eats most of the partition.
      # We need: 839MB DAC + 540MB revalidation + 16MB LEIE, plus the previous
      # run's copies held for diffing, plus decompression headroom. That fits
      # in 14GB but not comfortably, so reclaim the obvious ~25GB first.
      # ---------------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "::group::Before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "::group::After"
          df -h /
          echo "::endgroup::"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Prepare storage directory
        run: mkdir -p "$STORAGE_PATH/state"

      # ---------------------------------------------------------------------
      # Carry the connector diff state between monthly runs. Without it the
      # diff has nothing to compare against and reports every row as new.
      #
      # The key is unique per run so each run saves a fresh entry; restore-keys
      # falls back to the newest entry with the same prefix, which is the
      # previous month's state. This is the minimum viable fix, not the right
      # one: an Actions cache is best-effort and is evicted after 7 days
      # without a hit, and it does nothing for the seven-year payload
      # retention. See the STORAGE_PATH comment above for the s3:// fix.
      # ---------------------------------------------------------------------
      - name: Restore connector diff state
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: storage/state
          key: ingest-state-${{ github.run_id }}
          restore-keys: |
            ingest-state-

      # ---------------------------------------------------------------------
      # The ingest itself. `continue-on-error` is deliberate: a failure must
      # still reach the artifact-upload and status steps below, so that a bad
      # run produces a diff summary and a log we can read, not an empty page.
      # The job is failed explicitly at the end.
      # ---------------------------------------------------------------------
      - name: Run ingest
        id: ingest
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
          # Federal sources only. This workflow is the monthly cron for the CMS
          # and OIG bulk files; it carries DATABASE_URL and uploads its log as an
          # artifact. Nursys is a push-cadence source whose API password lives in
          # its own secret store, so it runs from its own workflow, never here --
          # keeping those credentials out of this workflow's environment and out
          # of the uploaded log. `all` is intentionally NOT the default.
          INGEST_SOURCES: ${{ github.event.inputs.sources || 'cms_dac,cms_revalidation,oig_leie' }}
        run: |
          set -o pipefail
          ARGS="--sources ${INGEST_SOURCES}"
          if [ "${INGEST_SOURCES}" = "all" ] || [ -z "${INGEST_SOURCES}" ]; then
            ARGS="--all"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          clinician-standing ingest $ARGS 2>&1 | tee "$STORAGE_PATH/ingest.log"

      - name: Disk usage after ingest
        if: ${{ !cancelled() }}
        run: df -h /

      - name: Source status
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: clinician-standing status | tee "$STORAGE_PATH/status.txt"

      # Scrub any secret value from the files about to be uploaded. GitHub masks
      # secrets in the LIVE log, but `tee` captured the raw stream to disk and the
      # artifact is retained 90 days and readable by anyone with repo access.
      # Nothing here is expected to print DATABASE_URL -- psycopg does not log the
      # URL -- but a stack trace or a future change could, so the artifact is
      # scrubbed of the exact secret rather than trusted not to contain it.
      - name: Redact secrets from artifacts
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import glob
          import os

          secret = os.environ.get("DATABASE_URL", "")
          if not secret:
              raise SystemExit(0)
          for name in glob.glob("storage/**", recursive=True):
              if not os.path.isfile(name):
                  continue
              try:
                  with open(name, encoding="utf-8", errors="replace") as fh:
                      text = fh.read()
              except OSError:
                  continue
              if secret in text:
                  with open(name, "w", encoding="utf-8") as fh:
                      fh.write(text.replace(secret, "[REDACTED_DATABASE_URL]"))
                  print(f"redacted a secret from {name}")
          PY

      # Upload the small artifacts only. The 839MB source files stay on the
      # runner and die with it; retaining them would blow through storage quota
      # and they are re-downloadable from CMS anyway.
      - name: Upload diff summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ingest-diff-${{ github.run_id }}
          path: |
            storage/diffs/**
            storage/*.json
            storage/ingest.log
            storage/status.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Record failure
        if: ${{ steps.ingest.outcome == 'failure' }}
        run: |
          {
            echo "## Monthly ingest FAILED"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Last 50 log lines:"
            echo '```'
            tail -n 50 "$STORAGE_PATH/ingest.log" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ingest step failed; failing the job after artifacts were uploaded."
          exit 1
