[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinician-standing"
version = "0.1.0"
description = "Ingest layer for the Clinician Standing verification platform: downloads federal healthcare bulk files, diffs them against the last run, and loads evidence into Supabase Postgres."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jack Gierlich" }]
keywords = ["healthcare", "credentialing", "cms", "oig", "leie", "supabase"]

# Runtime dependencies. Keep this list short on purpose: the ingest layer is a
# handful of downloads, a CSV parse and a COPY into Postgres.
dependencies = [
  "psycopg[binary]>=3.1,<4",   # Postgres driver; [binary] avoids needing libpq at build time
]

# requests and pandas were declared in the first draft and are deliberately not
# used: downloads stream through urllib to disk, and the 839MB DAC and 540MB
# revalidation files are parsed row-by-row with the csv module and loaded via
# COPY. Holding either file in a DataFrame would defeat the memory profile that
# lets this run on a standard GitHub Actions runner.

[project.optional-dependencies]
# Object storage for raw evidence payloads. evidence.py imports boto3 and
# botocore lazily, inside the `STORAGE_PATH is an s3:// URI` branch, and the
# ingest-monthly workflow says that s3:// is the production setting -- so the
# import is on the production path and was, until now, declared nowhere at all.
# A job that set an s3:// STORAGE_PATH would have failed at the first
# store_blob(), after the download, with "boto3 is not installed".
#
#   pip install -e ".[s3]"
s3 = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
]

dev = [
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
# types-requests and pandas-stubs used to be here. Both were stubs for packages
# this project does not have and does not import -- see the note above about
# requests and pandas -- so they added two supply-chain dependencies to every
# CI run and every developer machine in exchange for nothing.

[project.scripts]
clinician-standing = "clinician_standing.cli:main"

[project.urls]
Homepage = "https://clinicianstanding.com"

# --- packaging -------------------------------------------------------------
# src/ layout: the installed package is the one under test, never the working tree.
[tool.setuptools.packages.find]
where = ["src"]
include = ["clinician_standing*"]

[tool.setuptools.package-data]
clinician_standing = ["py.typed"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "storage", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import ordering)
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "RUF",      # ruff-specific
]
ignore = [
  "E501",     # line length is enforced by the formatter, not the linter
  "B008",     # function call in default argument: common and deliberate in CLI code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of a test file

[tool.ruff.lint.isort]
known-first-party = ["clinician_standing", "conftest"]

[tool.ruff.format]
quote-style = "double"

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["clinician_standing"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
exclude = ["^data/", "^storage/", "^\\.venv/"]

# Tests may be loosely typed; the production path may not be. `packages` above
# limits a bare `mypy` run to clinician_standing, so this section only applies
# when the tests are checked explicitly (`mypy tests`).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# Third-party packages that ship no stubs, or that are optional at runtime.
#
# psycopg 3 does ship py.typed, so when it is installed mypy uses its real
# types and this override changes nothing. It is here for the environments
# where the driver is absent -- a docs build, a lint-only container, a
# contributor who has not run `make install` yet -- so that a missing optional
# wheel produces no type errors rather than a wall of them that hides a real
# one.
#
# boto3/botocore ship no stubs at all and are an optional extra (`.[s3]`), so
# they are unresolvable by design in the default install.
[[tool.mypy.overrides]]
module = ["psycopg.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: test requires outbound network access (excluded from CI)",
  "database: test requires a live Postgres connection (excluded from CI)",
]
filterwarnings = ["error::DeprecationWarning:clinician_standing.*"]
